name: Sync Wikimasters collections

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: wikimasters-collection-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh collections
        env:
          WIKIMASTERS_COOKIE: ${{ secrets.WIKIMASTERS_COOKIE }}
        run: |
          if [ -z "$WIKIMASTERS_COOKIE" ]; then
            echo "::error::Configure the WIKIMASTERS_COOKIE repository secret."
            exit 1
          fi
          python update_collections.py

      - name: Commit and push changed collections
        id: commit
        run: |
          git add -- \
            data/bike_collection.json \
            data/cac40_collection.json \
            data/geek_collection.json \
            data/paris_collection.json \
            data/pl1_collection.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No collection changes to push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Wikimasters collections"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch Pages deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "deploy.yml",
              ref: "main",
            });